<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blitz Odds</title>
<meta name="description" content="Real-time multiplayer chess with time handicap">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#759900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blitz Odds">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#161512;color:#bab9b8;font-family:system-ui,sans-serif;min-height:100svh;touch-action:manipulation}
input[type=text],input[type=password],input[type=email]{background:#1f1e1d;color:#f0ede8;border:1px solid #3d3a36;border-radius:6px;padding:11px;font-size:16px;width:100%;outline:none}
input:focus{border-color:#759900}
button{cursor:pointer;font-family:inherit}
.btn-g{background:#759900;color:#fff;border:none;border-radius:6px;padding:10px 18px;font-weight:600;font-size:15px}
.btn-o{background:transparent;color:#bab9b8;border:1px solid #3d3a36;border-radius:6px;padding:8px 14px;font-size:14px}
.btn-b{background:#2c5a8c;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px}
.btn-r{background:#882020;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px}
.btn-v{background:#4a3a6a;color:#d0c0f0;border:none;border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px}
.card{background:#1f1e1d;border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid #2a2927}
.sq{position:relative;display:flex;justify-content:center;align-items:center;aspect-ratio:1;user-select:none}
.sq img{width:86%;height:86%;pointer-events:none;display:block}
.dot{position:absolute;width:32%;height:32%;border-radius:50%;background:rgba(0,0,0,0.18);pointer-events:none;z-index:2}
.cap-ring{position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(0,0,0,0.22);border-radius:50%;pointer-events:none;z-index:2}
.sort-btn{padding:5px 11px;border-radius:5px;border:1px solid #3d3a36;font-size:.78rem;background:transparent;color:#bab9b8}
.sort-btn.active{background:#2a2927;color:#f0ede8;border-color:#759900}
.tc-pre{padding:6px 0;border-radius:5px;border:1px solid #3d3a36;background:#161512;color:#bab9b8;font-size:.82rem;font-weight:600;flex:1}
.tc-pre.active{background:#2a3a00;color:#a8c000;border-color:#759900}
.tc-adj{padding:5px 9px;border-radius:5px;border:1px solid #3d3a36;background:#1f1e1d;color:#bab9b8;font-size:.82rem;min-width:38px}
.tab{padding:6px 10px;border-radius:5px;border:none;font-size:.82rem;font-weight:600;background:transparent;color:#6b6a69;flex:1}
.tab.active{background:#2a2927;color:#f0ede8}
#drag-ghost{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-55%);opacity:.92;display:none}
</style>
</head>
<body>
<img id="drag-ghost" src="" alt="" style="width:60px;height:60px">
<div id="app"><div style="display:flex;justify-content:center;align-items:center;height:100svh;color:#6b6a69">Loading...</div></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
